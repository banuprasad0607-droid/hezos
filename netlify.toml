[build]
  command = "npm run build"
  publish = "dist"
  functions = "dist/server"

[build.environment]
  VITE_SUPABASE_URL = "https://gzhoeihogdvvtwillihs.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_Uh1FODaxgjuD99id8nlimw_PO0tg8nB"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Uh1FODaxgjuD99id8nlimw_PO0tg8nB"
  SUPABASE_URL = "https://gzhoeihogdvvtwillihs.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Uh1FODaxgjuD99id8nlimw_PO0tg8nB"

[functions]
  node_bundler = "none"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval' blob:; frame-ancestors 'none';"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

